<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prescription Management - HMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2>Prescription Management</h2>
        <a href="/" class="btn btn-secondary mb-3">Back to Dashboard</a>
        
        <form method="POST" class="card p-4 mb-4 shadow-sm">
            <h4>Add Prescription</h4>
            <div class="mb-3">
                <label class="form-label">Select Patient</label>
                <select name="patient_id" class="form-control" required>
                    {% for p in patients %}
                    <option value="{{ p.id }}">{{ p.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Medicine Name</label>
                <input type="text" name="medicine" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Dosage</label>
                <input type="text" name="dosage" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Instructions</label>
                <textarea name="instructions" class="form-control" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save Prescription</button>
        </form>

        <h4>Prescription Records</h4>
        <table class="table table-bordered bg-white shadow-sm">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Patient Name</th>
                    <th>Medicine</th>
                    <th>Dosage</th>
                    <th>Instructions</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody>
                {% for rx in prescriptions %}
                <tr>
                    <td>{{ rx.id }}</td>
                    <td>{{ rx.patient_name }}</td>
                    <td>{{ rx.medicine }}</td>
                    <td>{{ rx.dosage }}</td>
                    <td>{{ rx.instructions }}</td>
                    <td>{{ rx.date }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
