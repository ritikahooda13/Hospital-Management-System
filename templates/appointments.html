<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Appointments - Hospital Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex h-screen">
    <div class="w-64 bg-blue-800 text-white flex flex-col">
        <div class="p-5 text-2xl font-bold">MediCare HMS</div>
        <nav class="flex-1 px-4 space-y-2 mt-4">
            <a href="/" class="block py-2.5 px-4 rounded hover:bg-blue-700">Dashboard</a>
            <a href="/patients" class="block py-2.5 px-4 rounded hover:bg-blue-700">Patients</a>
            <a href="/doctors" class="block py-2.5 px-4 rounded hover:bg-blue-700">Doctors</a>
            <a href="/appointments" class="block py-2.5 px-4 rounded bg-blue-900">Appointments</a>
            <a href="/billing" class="block py-2.5 px-4 rounded hover:bg-blue-700">Billing</a>
        </nav>
        <div class="p-4"><a href="/logout" class="block text-center py-2 bg-red-600 rounded">Logout</a></div>
    </div>
    <div class="flex-1 flex flex-col overflow-y-auto p-6">
        <h2 class="text-2xl font-bold mb-6">Manage Appointments</h2>
        <form method="POST" class="bg-white p-6 rounded shadow mb-6 grid grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-bold mb-1">Patient</label>
                <select name="patient_id" class="w-full border p-2 rounded">
                    {% for p in patients %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-bold mb-1">Doctor</label>
                <select name="doctor_id" class="w-full border p-2 rounded">
                    {% for d in doctors %}<option value="{{ d.id }}">{{ d.name }} ({{ d.specialization }})</option>{% endfor %}
                </select>
            </div>
            <div><label class="block text-sm font-bold mb-1">Date</label><input type="date" name="appointment_date" required class="w-full border p-2 rounded"></div>
            <button type="submit" class="bg-blue-600 text-white py-2 px-4 rounded col-span-3 hover:bg-blue-700">Schedule Appointment</button>
        </form>
        <div class="bg-white rounded shadow overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead><tr class="bg-gray-200"><th class="p-3">ID</th><th class="p-3">Patient</th><th class="p-3">Doctor</th><th class="p-3">Date</th><th class="p-3">Status</th></tr></thead>
                <tbody>
                    {% for a in appointments %}
                    <tr class="border-t"><td class="p-3">{{ a.id }}</td><td class="p-3">{{ a.patient_name }}</td><td class="p-3">{{ a.doctor_name }}</td><td class="p-3">{{ a.appointment_date }}</td><td class="p-3"><span class="bg-green-100 text-green-700 px-2 py-1 rounded text-sm">{{ a.status }}</span></td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
